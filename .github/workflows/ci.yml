name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned tools (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Install Wally packages
        run: wally install

      - name: StyLua (format check)
        run: stylua --check src tests tools studio

      - name: selene (lint)
        run: selene src tests tools studio

      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Download Roblox type definitions (matched to the pinned luau-lsp)
        run: |
          LSP_VERSION=$(grep -oP 'luau-lsp@\K[0-9.]+' rokit.toml)
          curl -sSfL -o globalTypes.d.luau \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LSP_VERSION}/scripts/globalTypes.d.luau"

      - name: luau-lsp (strict type analysis, game code)
        run: |
          luau-lsp analyze \
            --platform=roblox \
            --definitions=@roblox=globalTypes.d.luau \
            --sourcemap=sourcemap.json \
            --settings=.vscode/settings.json \
            --ignore="**/_Index/**" \
            src studio

      - name: luau-lsp (strict type analysis, tests and tools)
        run: luau-lsp analyze --platform=standard --settings=.vscode/settings.json tests tools

      - name: Lune unit tests
        run: lune run tests/run.luau

      - name: HUD layout check (five screens, the busiest states; nothing overlaps, off screen or in the play zone)
        run: lune run tools/layoutCheck.luau

      - name: World smoke test (builds every map theme offline)
        run: lune run tools/worldsim/smoke.luau

      - name: Server test (boots the server offline and plays a short session)
        run: lune run tools/worldsim/server.luau

      - name: Pre-launch server fixes (offline server, virtual clock, one scenario per fixed review finding)
        run: lune run tools/worldsim/prelaunch.luau

      - name: Gadgets (offline server, virtual clock, every gadget through the real remotes)
        run: lune run tools/worldsim/gadgets.luau

      - name: Studio sync script test (pulls this checkout into Rojo-built places offline)
        run: |
          mkdir -p build
          rojo build default.project.json --output build/sync.rbxl
          lune run tools/syncTest.luau build/sync.rbxl
